name: lint-pr

on: [pull_request]

jobs:
  lint:
    name: Run linters on PR

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
